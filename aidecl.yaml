schema_version: "1.0.0"

project:
  name: bonsai_docker
  license: MIT
  content_type: software

ai_usage:
  used: true
  level: extensive
  summary: >-
    An AI coding agent (Claude Code) researched runtime compatibility of the
    Ternary-Bonsai-2-27B GGUF quantizations with Ollama, then wrote the
    Docker Compose stack, Modelfile, smoke test, README and metadata files
    on 2026-11-17 from the user's request, then retargeted it to a laptop
    with a Quadro T1000 (4 GB) and 48 GB RAM. The download/import wiring was
    tested end to end with a 1 MB stand-in model on a CPU-only machine. The
    real model and the GPU path have NOT been run on the target laptop yet.
    The user has not yet reviewed the files line by line.
  tools:
    - name: Claude Code
      vendor: Anthropic
      type: agent
      model: claude-opus-5-5
      hosting: cloud_vendor
      period: { start: "2026-11-17", end: "2026-11-17" }
      purpose: [research, configuration, documentation, testing]
    - name: rseng-agent-skills
      type: standalone
      version: "0.2.0"
      skills_consulted:
        - rseng-quality-framework
        - rseng-reproducible-environments
        - rseng-agent-security
        - rseng-ai-declaration
        - rseng-honesty
        - rseng-human-verification
        - rseng-project-tracking
        - rseng-version-control-review
        - rseng-code-review
        - rseng-testing
        - rseng-gpu-computing
  activities: [code_generation, testing, documentation]
  scope:
    code_generation: true
    code_review: false
    documentation: true
    testing: true
    infrastructure: true
  code_proportion:
    ai_generated_percent: 100
    ai_assisted_percent: 0
    human_only_percent: 0
    method: self_reported
  components:
    - name: deployment (compose.yaml, compose.override.yaml, Modelfile)
      description: Ollama 0.40.16 with NVIDIA GPU reservation, sha256-checked model download, one-shot import
      ai_involvement: >-
        Written by the agent on 2026-11-17. The choice of Q2_0 and the
        pinned Ollama version follow the model's KNOWN_ISSUES.md and
        Ollama's LLAMA_CPP_VERSION file.
      tools_used: [Claude Code]
      notes: not yet reviewed by a human
    - name: scripts (smoke_test.sh, check_host.sh)
      description: >-
        known-answer smoke test with speed and GPU-split report; host
        preflight for the driver, container toolkit, RAM and disk
      ai_involvement: >-
        Written by the agent. The smoke test ran against a stand-in model
        (pass and fail paths). check_host.sh ran on a non-target machine
        (correctly reported missing GPU access).
      tools_used: [Claude Code]
      notes: not yet reviewed by a human

declaration:
  date: "2026-11-17"
  declared_by: Sarah
  reviewed_by: none yet
  notes: >-
    2026-11-17 initial declaration drafted by the agent for the user's
